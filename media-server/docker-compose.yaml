---
version: "3"

services:
  plex:
    image: ghcr.io/linuxserver/plex
    container_name: plex
    restart: unless-stopped
    environment:
      - VERSION=docker
      - PUID=2000 # repo
      - PGID=2000 # repo
      - TZ=Europe/London
      - ADVERTISE_IP="http://plex.${DEFAULT_DOMAIN}:32400/"
    ports:
      - 1900:1900/udp
      - 3005:3005/tcp
      - 32400:32400/tcp
      - 32400:32400/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 32469:32469/tcp
      - 8324:8324/tcp
    volumes:
      - "${DEFAULT_DOCKER_PATH}/plex:/config"
      - "/data/repo/media/shows:/shows"
      - "/data/repo/media/movies:/movies"
      - "/data/repo/media/music:/music"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.entrypoints=web"
      - "traefik.http.routers.plex.rule=Host(`plex.${DEFAULT_DOMAIN}`)"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"

    networks:
      - traefik-network

networks:
  traefik-network:
    name: traefik-network
    external: true
